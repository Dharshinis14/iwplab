<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic DOM Manipulation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h2 {
            color: #333;
        }

        #container {
            margin: 20px auto;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 8px;
            min-height: 100px;
            max-width: 500px;
            background-color: white;
        }

        button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #007BFF;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        p {
            padding: 8px;
        }
    </style>
</head>

<body>

    <h2>Dynamic DOM Manipulation</h2>

    <button onclick="addElement()">Add Element</button>
    <button onclick="removeElement()">Remove Element</button>
    <button onclick="modifyElement()">Modify Element</button>

    <div id="container">
        <p id="para1">This is the first paragraph.</p>
    </div>

    <script>
        // Add a new paragraph
        function addElement() {
            const p = document.createElement("p");

            p.textContent = "New paragraph added dynamically!";

            document.getElementById("container").appendChild(p);
        }

        // Remove the last paragraph
        function removeElement() {
            const container = document.getElementById("container");

            if (container.lastElementChild) {
                container.removeChild(container.lastElementChild);
            } else {
                alert("No elements to remove!");
            }
        }

        // Modify the first paragraph
        function modifyElement() {
            const para = document.getElementById("para1");

            if (para) {
                para.textContent = "This paragraph has been modified!";
                para.style.color = "red";
                para.style.fontWeight = "bold";
                
            }
        }
    </script>

</body>
</html>
