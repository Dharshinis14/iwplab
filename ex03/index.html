<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input {
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>

    <script>
        function validateForm() {
            let f = document.forms["regForm"];

            // Name validation
            if (f["name"].value.trim() === "") {
                alert("Name should not be empty.");
                return false;
            }

            // Email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(f["email"].value.trim())) {
                alert("Please enter a valid email address.");
                return false;
            }

            // Phone validation
            if (!/^[0-9]{10}$/.test(f["phone"].value.trim())) {
                alert("Phone number should contain exactly 10 digits.");
                return false;
            }

            // Password validation
            if (f["password"].value.length < 6) {
                alert("Password should be at least 6 characters long.");
                return false;
            }

            alert("Registration Successful!");
            return true;
        }
    </script>
</head>

<body>

    <div class="form-container">

        <h2>Registration Form</h2>

        <form name="regForm" onsubmit="return validateForm()">

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                maxlength="10"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
